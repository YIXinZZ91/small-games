<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🪐 重力翻转</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.wrap{position:relative;width:420px;max-width:100vw;height:100vh;max-height:780px}
canvas{display:block;width:100%;height:100%}

.start-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.start-overlay .planet{font-size:72px;animation:float 2.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-20px)}}
.start-overlay h1{font-size:32px;color:#fff;margin:8px 0;background:linear-gradient(135deg,#00d2ff,#7b2ff7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.start-overlay .tag{color:#778;font-size:13px;margin-bottom:20px}
.start-overlay .rules{background:rgba(255,255,255,.05);border-radius:14px;padding:18px 24px;max-width:300px;margin-bottom:22px}
.start-overlay .rules p{color:#aab;font-size:13px;margin:6px 0;line-height:1.7}
.start-overlay .rules .key{color:#00d2ff;font-weight:700}
.btn{font-family:inherit;border:none;border-radius:30px;padding:13px 44px;font-size:17px;font-weight:700;cursor:pointer;transition:.2s;margin:4px}
.btn-play{background:linear-gradient(135deg,#00d2ff,#7b2ff7);color:#fff;box-shadow:0 4px 24px rgba(0,210,255,.35)}
.btn-play:active{transform:scale(.93)}
.btn-revive{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;animation:glow 1.5s infinite}
.btn-restart{background:rgba(255,255,255,.15);color:#fff}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}50%{box-shadow:0 0 0 16px rgba(255,107,107,0)}}

.hud{position:absolute;top:16px;left:16px;right:16px;display:none;justify-content:space-between;z-index:10;pointer-events:none}
.hud .hud-item{background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:12px;padding:6px 14px;color:#fff;font-size:15px;font-weight:700}
.hud .hud-best{color:#ffd700}

.go-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20}
.go-overlay .go-icon{font-size:64px;margin-bottom:8px}
.go-overlay .go-score{font-size:56px;font-weight:900;color:#fff;margin-bottom:4px}
.go-overlay .go-best{color:#ffd700;font-size:16px;margin-bottom:18px}
.go-overlay .go-msg{color:#aab;font-size:14px;margin-bottom:16px}

.ad-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:#0a0a1a;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;text-align:center}
.ad-overlay .ad-icon{font-size:52px;animation:float 1s ease infinite}
.ad-overlay .ad-timer{font-size:64px;font-weight:900;color:#ffd700;margin:12px 0}
.ad-overlay .ad-note{color:#666;font-size:12px}

.flip-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(255,255,255,.5);font-size:28px;font-weight:700;pointer-events:none;animation:fadeHint 2s ease forwards;z-index:15}
@keyframes fadeHint{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <canvas id="c"></canvas>

  <div class="start-overlay" id="startScreen">
    <div class="planet">🪐</div>
    <h1>重力翻转</h1>
    <p class="tag">Gravity Flip · 原创独立游戏</p>
    <div class="rules">
      <p><span class="key">🖐 点击屏幕</span> → 重力反转，小球上下飞</p>
      <p><span class="key">🪨 落在平台上</span> → 得分，继续前进</p>
      <p><span class="key">⚡ 越往后越快</span>，平台越窄</p>
      <p><span class="key">💀 掉出屏幕</span> → 游戏结束</p>
      <p style="color:#ffd700;margin-top:8px">🏆 挑战你的最高分！</p>
    </div>
    <button class="btn btn-play" onclick="startGame()">🎮 开始挑战</button>
  </div>

  <div class="hud" id="hud">
    <div class="hud-item">🏆 <span id="scoreD">0</span></div>
    <div class="hud-item hud-best">👑 <span id="bestD">0</span></div>
  </div>

  <div class="go-overlay" id="goScreen">
    <div class="go-icon">💥</div>
    <div class="go-score" id="goScore">0</div>
    <div class="go-best">最高 <span id="goBest">0</span></div>
    <div class="go-msg" id="goMsg"></div>
    <button class="btn btn-revive" onclick="doRevive()">📺 看广告复活</button>
    <button class="btn btn-restart" onclick="fullRestart()">🔄 再来一次</button>
  </div>

  <div class="ad-overlay" id="adScreen">
    <div class="ad-icon">📺</div>
    <p style="color:#fff;font-size:18px">正在播放广告</p>
    <div class="ad-timer" id="adTimer">5</div>
    <p class="ad-note">感谢支持 · 广告后复活继续</p>
  </div>
</div>

<script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),wrap=document.getElementById('wrap');
let W,H;

function rs(){
  W=Math.min(420,window.innerWidth);
  H=Math.min(780,window.innerHeight);
  c.width=W;c.height=H;
}
rs();window.addEventListener('resize',rs);

// Game state
let ball=null,platforms=[],stars=[],score=0,best=0,run=false,gravityDown=true,speed=2,spawnTimer=0,spawnInterval=50,adCnt=0,started=false,combo=0;

best=parseInt(localStorage.getItem('gf_best')||0);
document.getElementById('bestD').textContent=best;
document.getElementById('goBest').textContent=best;

const BALL_R=18;
const PLAT_H=12;

function init(){
  ball={x:W/2,y:H/2,vx:1.5,vy:0,r:BALL_R,trail:[]};
  platforms=[];
  stars=[];
  score=0;speed=2;spawnTimer=0;spawnInterval=50;gravityDown=true;combo=0;adCnt=0;
  // Create initial platforms
  platforms.push({x:W/2-60,y:H*.65,w:120});
  platforms.push({x:W*.2,y:H*.4,w:100});
  platforms.push({x:W*.65,y:H*.25,w:90});
  platforms.push({x:W*.35,y:H*.1,w:110});
  // Stars
  for(let i=0;i<80;i++)stars.push({x:Math.random()*W,y:Math.random()*H,s:Math.random()*1.5+.5,b:Math.random()*.5+.5});
}

function spawnPlatform(){
  const last=platforms[platforms.length-1];
  const py=last?last.y-(60+Math.random()*50):H*.7;
  const pw=Math.max(40,110-speed*3);
  const px=30+Math.random()*(W-pw-60);
  // sometimes spawn bonus narrow platform
  if(Math.random()<.1){platforms.push({x:px,y:py,w:Math.max(20,pw*.5),bonus:true})}
  else platforms.push({x:px,y:py,w:pw});
}

function startGame(){
  started=true;init();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('hud').style.display='flex';
  document.getElementById('scoreD').textContent='0';
  run=true;
  // initial platforms
  for(let i=0;i<6;i++)spawnPlatform();
  // Give ball initial position on first platform
  ball.y=platforms[0].y-BALL_R-2;
  ball.x=platforms[0].x+platforms[0].w/2;
  gravityDown=false;
  ball.vy=-1;
}

function flipGravity(){
  if(!run)return;
  gravityDown=!gravityDown;
  ball.vy=gravityDown?4:-4;
  ball.vx+=(Math.random()-.5)*1;
  // visual feedback
  const h=document.createElement('div');h.className='flip-hint';
  h.textContent=gravityDown?'⬇':'⬆';
  h.style.color=gravityDown?'rgba(0,210,255,.6)':'rgba(123,47,247,.6)';
  wrap.appendChild(h);setTimeout(()=>h.remove(),2000);
}

function update(){
  if(!run)return;
  // stars bg
  for(const s of stars){s.y+=speed*.15;if(s.y>H){s.y=0;s.x=Math.random()*W}}

  // Ball physics
  ball.vy+=gravityDown?.35:-.35;
  ball.x+=ball.vx;
  ball.y+=ball.vy;
  // Wrap x
  if(ball.x<-BALL_R)ball.x=W+BALL_R;
  if(ball.x>W+BALL_R)ball.x=-BALL_R;
  // Clamp vx
  ball.vx=Math.max(-4,Math.min(4,ball.vx));

  // Check platform collision
  let onPlatform=false;
  for(const p of platforms){
    if(ball.y+ball.r>=p.y&&ball.y-ball.r<=p.y+PLAT_H&&
       ball.x+ball.r>p.x&&ball.x-ball.r<p.x+p.w){
      if(gravityDown&&ball.vy>0){
        ball.y=p.y-BALL_R;
        ball.vy=-Math.abs(ball.vy)*.85;
        onPlatform=true;
      }else if(!gravityDown&&ball.vy<0){
        ball.y=p.y+PLAT_H+BALL_R;
        ball.vy=Math.abs(ball.vy)*.85;
        onPlatform=true;
      }
    }
  }

  // Score when passing platforms
  for(const p of platforms){
    if(!p.scored&&(
      (gravityDown&&ball.y<p.y-40)||(!gravityDown&&ball.y>p.y+PLAT_H+40)
    )){
      p.scored=true;
      score+=p.bonus?3:1;
      combo++;
      if(combo%10===0)speed+=.3;
      document.getElementById('scoreD').textContent=score;
    }
  }

  // Remove off-screen platforms
  platforms=platforms.filter(p=>p.y<H+100);

  // Spawn new platforms
  spawnTimer++;
  if(spawnTimer>=spawnInterval){
    spawnTimer=0;
    spawnInterval=Math.max(18,55-speed*3);
    spawnPlatform();
  }

  // Move platforms down/up based on gravity
  for(const p of platforms){
    p.y+=speed*.3;
  }

  // Trail
  ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>8)ball.trail.shift();

  // Game over
  if(ball.y<-50||ball.y>H+50){endGame()}
}

function endGame(){
  if(!run)return;run=false;
  if(score>best){best=score;localStorage.setItem('gf_best',best);document.getElementById('bestD').textContent=best}
  document.getElementById('goScore').textContent=score;
  document.getElementById('goBest').textContent=best;
  const msgs=['😤 差一点！再来！','🔥 手感不错！继续！','💪 还能更高！','🎯 渐入佳境！','⚡ 突破极限！'];
  document.getElementById('goMsg').textContent=score>30?msgs[Math.floor(Math.random()*msgs.length)]:'熟悉一下节奏，再来一次！';
  document.getElementById('goScreen').style.display='flex';
}

function doRevive(){
  document.getElementById('goScreen').style.display='none';
  const ad=document.getElementById('adScreen');ad.style.display='flex';
  let t=5;document.getElementById('adTimer').textContent=t;
  const iv=setInterval(()=>{t--;document.getElementById('adTimer').textContent=t;
    if(t<=0){clearInterval(iv);ad.style.display='none';reviveExec()}},1000);
}
function reviveExec(){
  adCnt++;run=true;ball.y=H*.4;ball.x=W/2;ball.vy=gravityDown?3:-3;ball.vx=1;
  // clear nearby platforms to give room
  platforms=platforms.filter(p=>Math.abs(p.y-ball.y)>80);
  // add a safe platform below
  platforms.unshift({x:ball.x-55,y:ball.y+60,w:110});
  document.getElementById('goScreen').style.display='none';
}
function fullRestart(){
  init();started=true;run=true;
  for(let i=0;i<6;i++)spawnPlatform();
  ball.y=platforms[0].y-BALL_R-2;ball.x=platforms[0].x+platforms[0].w/2;
  gravityDown=false;ball.vy=-1;
  document.getElementById('scoreD').textContent='0';
  document.getElementById('goScreen').style.display='none';
  document.getElementById('adScreen').style.display='none';
  document.getElementById('hud').style.display='flex';
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // Space bg
  const bg=ctx.createLinearGradient(0,0,0,H);
  // Planet decoration
  ctx.fillStyle=`rgba(255,255,255,.02)`;ctx.strokeStyle=`rgba(255,255,255,.05)`;
  ctx.beginPath();ctx.arc(W/2,H/2,80,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,120,0,Math.PI*2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,160,0,Math.PI*2);ctx.stroke();
  bg.addColorStop(0,'#0a0a2e');bg.addColorStop(.5,'#0d1040');bg.addColorStop(1,'#0a0a2e');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  // Stars
  for(const s of stars){
    ctx.fillStyle=`rgba(255,255,255,${s.b})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();
  }

  // Platforms
  for(const p of platforms){
    const grad=ctx.createLinearGradient(p.x,p.y,p.x,p.y+PLAT_H);
    if(p.bonus){
      grad.addColorStop(0,'#ffd700');grad.addColorStop(1,'#ff8c00');
    }else{
      grad.addColorStop(0,'#5a7a9a');grad.addColorStop(1,'#3a4a6a');
    }
    ctx.fillStyle=grad;ctx.shadowColor=p.bonus?'rgba(255,215,0,.4)':'rgba(100,140,255,.2)';
    ctx.shadowBlur=8;
    rr(p.x,p.y,p.w,PLAT_H,6);ctx.fill();
    ctx.shadowBlur=0;
  }

  if(!ball)return;
  // Ball trail
  for(let i=0;i<ball.trail.length;i++){
    const t=ball.trail[i];
    const alpha=(i/ball.trail.length)*.4;
    const r=ball.r*(i/ball.trail.length);
    ctx.fillStyle=`rgba(0,229,255,${alpha})`;
    ctx.shadowColor=`rgba(0,229,255,${alpha*.3})`;
    ctx.shadowBlur=r*2;
    ctx.beginPath();ctx.arc(t.x,t.y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;

  // Ball
  ctx.shadowColor='rgba(0,229,255,.9)';ctx.shadowBlur=30;
  const bgB=ctx.createRadialGradient(ball.x-3,ball.y-3,2,ball.x,ball.y,ball.r);
  bgB.addColorStop(0,'#fff');bgB.addColorStop(.4,'#00d2ff');bgB.addColorStop(1,'#7b2ff7');
  ctx.fillStyle=bgB;
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;

  // Direction indicator
  ctx.fillStyle='rgba(255,255,255,.6)';ctx.font='11px "PingFang SC"';
  ctx.textAlign='center';
  ctx.font="13px PingFang SC";ctx.fillStyle='rgba(255,255,255,.8)';
  ctx.fillText(gravityDown?'⬇ 重力向下':'⬆ 重力向上',ball.x,ball.y+ball.r+24);
}

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

function loop(){if(!draw)return;update();draw();requestAnimationFrame(loop)}

// Input
c.addEventListener('click',flipGravity);
c.addEventListener('touchstart',e=>{e.preventDefault();flipGravity()},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='KeyW'||e.code==='ArrowUp'){e.preventDefault();flipGravity()}
});

loop();
</script>
</body>
</html>
