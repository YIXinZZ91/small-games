<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>光遇小灵 · 动漫伙伴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0f0c29,#302b63,#24243e);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
.w{width:420px;max-width:100vw;height:100vh;max-height:820px;position:relative;display:flex;flex-direction:column;align-items:center}
.stars{position:absolute;top:0;left:0;right:0;height:55%;pointer-events:none}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 2.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0.2}50%{opacity:0.9}}
canvas{display:block;width:100%;flex:1;min-height:0}
.chat{width:94%;background:rgba(255,255,255,0.04);backdrop-filter:blur(16px);border-radius:20px;border:1px solid rgba(255,255,255,0.06);padding:14px 16px;margin-bottom:10px}
.chat .lb{color:rgba(255,255,255,0.3);font-size:11px;margin-bottom:4px}
.chat .tx{color:#dde;font-size:15px;line-height:1.7;min-height:44px}
.bar{width:94%;display:flex;gap:8px;margin-bottom:8px}
.bar input{flex:1;padding:12px 18px;border-radius:28px;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);color:#dde;font-size:14px;outline:none;font-family:inherit;transition:0.3s}
.bar input:focus{border-color:rgba(200,180,255,0.3)}
.bar button{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer;font-size:22px;flex-shrink:0;transition:0.2s}
.bar .mic{background:linear-gradient(135deg,#a78bfa,#7c3aed);color:#fff;box-shadow:0 3px 15px rgba(124,58,237,0.3)}
.bar .mic:active{transform:scale(0.9)}
.bar .mic.a{background:linear-gradient(135deg,#f472b6,#ec4899);animation:pl 0.8s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(236,72,153,0.5)}50%{box-shadow:0 0 0 14px rgba(236,72,153,0)}}
.bar .snd{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff}
.bar .snd:active{transform:scale(0.9)}
.qt{width:94%;display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px;justify-content:center}
.qt button{padding:5px 14px;border-radius:14px;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.45);font-size:11px;cursor:pointer;font-family:inherit;transition:0.2s}
.qt button:hover{background:rgba(255,255,255,0.08);color:#fff;border-color:rgba(200,180,255,0.2)}
.st{color:rgba(255,255,255,0.2);font-size:11px;text-align:center;margin-bottom:4px}
</style>
</head>
<body>
<div class="w">
<div class="stars" id="stars"></div>
<canvas id="cv"></canvas>
<div class="chat">
<div class="lb" id="lb">小灵说</div>
<div class="tx" id="tx">你好呀！我是小灵，你的光遇动漫伙伴 ✨</div>
</div>
<div class="bar">
<input id="inp" placeholder="打字说点什么..." onkeydown="if(event.key==='Enter')sd()">
<button class="mic" id="mb" onclick="tm()">🎤</button>
<button class="snd" onclick="sd()">➡</button>
</div>
<div class="qt">
<button onclick="q('今天跑图路线')">🏃 跑图</button>
<button onclick="q('大蜡烛在哪')">🕯 蜡烛</button>
<button onclick="q('讲个故事')">📖 故事</button>
<button onclick="q('唱首歌')">🎵 唱歌</button>
<button onclick="q('你好可爱')">💕 夸夸</button>
</div>
<p class="st" id="st">💜 点话筒语音聊天 · 打字也可</p>
</div>
<script>
const cv=document.getElementById("cv"),ctx=cv.getContext("2d");
let W,H,cx,by;
function rs(){const r=cv.parentElement.getBoundingClientRect();
W=Math.min(420,r.width);H=Math.min(500,r.height-20);
cv.width=W;cv.height=H;cx=W/2;}
rs();window.addEventListener("resize",rs);

// Stars
const ss=document.getElementById("stars");
for(let i=0;i<60;i++){const s=document.createElement("div");s.className="star";
s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";
s.style.animationDelay=Math.random()*3+"s";s.style.width=s.style.height=(1+Math.random()*2)+"px";
ss.appendChild(s);}

// Character state
let expr="idle",talk=false,blink=false,gTick=0,waveA=0,breathe=0;
let armL=0,armR=0,mood=80,eyeTx=0;

// Draw character
function dr(){
ctx.clearRect(0,0,W,H);
gTick++;breathe=Math.sin(gTick/60)*0.06;
blink=Math.sin(gTick/80)<0.008;

// Draw glow
let grd=ctx.createRadialGradient(cx,210,20,cx,210,180);
grd.addColorStop(0,"rgba(168,139,255,0.03)");grd.addColorStop(1,"rgba(168,139,255,0)");
ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);

by=220+Math.sin(gTick/60)*3;

// === CAPE / WINGS ===
ctx.shadowBlur=15;ctx.shadowColor="rgba(168,139,255,0.15)";
ctx.beginPath();ctx.moveTo(cx-15,by-25);
ctx.quadraticCurveTo(cx-80,by-10,cx-70,by+55);
ctx.quadraticCurveTo(cx-30,by+78,cx,by+60);
ctx.quadraticCurveTo(cx+30,by+78,cx+70,by+55);
ctx.quadraticCurveTo(cx+80,by-10,cx+15,by-25);
ctx.fillStyle="rgba(168,139,255,0.08)";ctx.fill();
ctx.shadowBlur=0;

// === BODY ===
ctx.beginPath();ctx.moveTo(cx-28,by-8);
ctx.quadraticCurveTo(cx,by-20,cx+28,by-8);
ctx.lineTo(cx+38,by+60);ctx.quadraticCurveTo(cx,by+68,cx-38,by+60);
ctx.closePath();
ctx.fillStyle="rgba(255,255,255,0.04)";ctx.fill();

// === LEFT ARM ===
let laX=cx-30,laY=by+5;
let laS=expr==="wave"?Math.sin(gTick/15)*18:expr==="talk"?Math.sin(gTick/10)*8+5:3;
ctx.beginPath();ctx.moveTo(laX,laY);
ctx.quadraticCurveTo(laX-20-laS,laY+15,laX-15-laS,laY+38);
ctx.strokeStyle=mood>50?"rgba(168,139,255,0.3)":"rgba(200,100,100,0.2)";
ctx.lineWidth=8;ctx.lineCap="round";ctx.stroke();
// Hand
ctx.beginPath();ctx.arc(laX-15-laS,laY+38,5,0,Math.PI*2);
ctx.fillStyle="rgba(255,255,255,0.1)";ctx.fill();

// === RIGHT ARM ===
let raX=cx+30,raY=by+5;
let raS=expr==="think"?12:expr==="talk"?Math.sin(gTick/12+1)*6+3:2;
ctx.beginPath();ctx.moveTo(raX,raY);
ctx.quadraticCurveTo(raX+18+raS,raY+12,raX+12+raS,raY+36);
ctx.strokeStyle=mood>50?"rgba(168,139,255,0.3)":"rgba(200,100,100,0.2)";
ctx.lineWidth=8;ctx.lineCap="round";ctx.stroke();
ctx.beginPath();ctx.arc(raX+12+raS,raY+36,5,0,Math.PI*2);
ctx.fillStyle="rgba(255,255,255,0.1)";ctx.fill();

// === LEGS ===
ctx.strokeStyle="rgba(255,255,255,0.04)";ctx.lineWidth=7;
ctx.beginPath();ctx.moveTo(cx-12,by+60);ctx.lineTo(cx-18,by+85);
ctx.stroke();
ctx.beginPath();ctx.moveTo(cx+12,by+60);ctx.lineTo(cx+18,by+85);
ctx.stroke();

// === HEAD ===
let hy=by-42,hr=32;

// Hair back
ctx.shadowBlur=20;ctx.shadowColor="rgba(168,139,255,0.2)";
ctx.beginPath();ctx.arc(cx,hy,hr+2,0,Math.PI*2);
ctx.fillStyle="rgba(100,80,160,0.15)";ctx.fill();

// Face
ctx.shadowBlur=0;
ctx.beginPath();ctx.arc(cx,hy,hr,0,Math.PI*2);
let fg=ctx.createRadialGradient(cx-5,hy-6,5,cx,hy,hr);
fg.addColorStop(0,"rgba(255,255,255,0.12)");fg.addColorStop(1,"rgba(200,190,230,0.04)");
ctx.fillStyle=fg;ctx.fill();

// === HAIR BANGS ===
ctx.fillStyle="rgba(120,90,180,0.12)";
ctx.beginPath();ctx.arc(cx-5,hy-32,22,Math.PI*0.8,Math.PI*2.2);ctx.fill();
ctx.beginPath();ctx.arc(cx+8,hy-34,18,Math.PI*0.9,Math.PI*2.1);ctx.fill();
// Side hair
ctx.beginPath();ctx.arc(cx-30,hy-5,12,0,Math.PI*2);
ctx.fillStyle="rgba(120,90,180,0.08)";ctx.fill();
ctx.beginPath();ctx.arc(cx+30,hy-5,12,0,Math.PI*2);
ctx.fill();

// === EYES ===
let eyeY=hy+3;
if(blink){
ctx.strokeStyle="rgba(255,255,255,0.3)";ctx.lineWidth=1.5;
ctx.beginPath();ctx.moveTo(cx-14,eyeY);ctx.lineTo(cx-4,eyeY);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx+4,eyeY);ctx.lineTo(cx+14,eyeY);ctx.stroke();
}else{
// Eye whites
ctx.fillStyle="rgba(255,255,255,0.5)";
ctx.beginPath();ctx.ellipse(cx-9,eyeY,7,8,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(cx+9,eyeY,7,8,0,0,Math.PI*2);ctx.fill();
// Iris
let ix=eyeTx/40;
let iris=ctx.createRadialGradient(cx-9+ix,eyeY+1,2,cx-9+ix,eyeY+1,5);
iris.addColorStop(0,"rgba(160,140,255,0.8)");iris.addColorStop(0.6,"rgba(100,80,200,0.7)");iris.addColorStop(1,"rgba(60,40,120,0.5)");
ctx.fillStyle=iris;
ctx.beginPath();ctx.ellipse(cx-9+ix,eyeY+1,5,6,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(cx+9+ix,eyeY+1,5,6,0,0,Math.PI*2);ctx.fill();
// Pupils
ctx.fillStyle="rgba(30,20,60,0.8)";
ctx.beginPath();ctx.arc(cx-9+ix,eyeY+1,2.2,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(cx+9+ix,eyeY+1,2.2,0,Math.PI*2);ctx.fill();
// Highlight
ctx.fillStyle="rgba(255,255,255,0.7)";
ctx.beginPath();ctx.arc(cx-9+ix-2,eyeY-2,1.2,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(cx+9+ix-2,eyeY-2,1.2,0,Math.PI*2);ctx.fill();
// Under eye shadow (cute)
ctx.strokeStyle="rgba(200,180,255,0.12)";ctx.lineWidth=1.5;
ctx.beginPath();ctx.arc(cx-9,eyeY+6,5,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
ctx.beginPath();ctx.arc(cx+9,eyeY+6,5,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
}

// === EYEBROWS ===
ctx.strokeStyle="rgba(120,90,180,0.2)";ctx.lineWidth=2;ctx.lineCap="round";
if(expr==="sad"){ctx.beginPath();ctx.beginPath();ctx.arc(cx-10,hy-12,6,Math.PI*1.3,Math.PI*1.7);ctx.stroke();
ctx.beginPath();ctx.arc(cx+10,hy-12,6,Math.PI*1.3,Math.PI*1.7);ctx.stroke();}
else if(expr==="happy"){ctx.beginPath();ctx.beginPath();ctx.arc(cx-10,hy-12,6,Math.PI*0.3,Math.PI*0.7);ctx.stroke();
ctx.beginPath();ctx.arc(cx+10,hy-12,6,Math.PI*0.3,Math.PI*0.7);ctx.stroke();}
else{ctx.beginPath();ctx.moveTo(cx-16,hy-10);ctx.quadraticCurveTo(cx-9,hy-14,cx-3,hy-10);ctx.stroke();
ctx.beginPath();ctx.moveTo(cx+3,hy-10);ctx.quadraticCurveTo(cx+9,hy-14,cx+16,hy-10);ctx.stroke();}

// === MOUTH ===
if(talk){
let m=Math.sin(gTick/8)*2+3;
ctx.fillStyle="rgba(255,200,150,0.25)";
ctx.beginPath();ctx.ellipse(cx,hy+14,4,m,0,0,Math.PI*2);ctx.fill();
}else if(expr==="happy"){
ctx.strokeStyle="rgba(255,200,150,0.35)";ctx.lineWidth=2.5;
ctx.beginPath();ctx.arc(cx,hy+12,6,0.1,Math.PI-0.1);ctx.stroke();
}else if(expr==="sad"){
ctx.strokeStyle="rgba(200,180,200,0.25)";ctx.lineWidth=2;
ctx.beginPath();ctx.arc(cx,hy+18,5,Math.PI+0.1,Math.PI*2-0.1);ctx.stroke();
}else{
ctx.strokeStyle="rgba(255,200,150,0.2)";ctx.lineWidth=2;
ctx.beginPath();ctx.arc(cx,hy+14,4,0.2,Math.PI-0.2);ctx.stroke();
}

// === HAIR ACCESSORIES (flower) ===
ctx.fillStyle="rgba(255,200,230,0.15)";
for(let i=0;i<5;i++){let a=i*1.256;ctx.beginPath();
ctx.ellipse(cx+15+Math.cos(a)*5,hy-32+Math.sin(a)*5,3,5,a,0,Math.PI*2);ctx.fill();}
ctx.fillStyle="rgba(255,230,200,0.12)";
ctx.beginPath();ctx.arc(cx+15,hy-32,2.5,0,Math.PI*2);ctx.fill();

// === GLOWING ORB ===
let oy=by+55+Math.sin(gTick/40)*2;
ctx.shadowBlur=30;ctx.shadowColor="rgba(168,139,255,0.4)";
ctx.beginPath();ctx.arc(cx,oy,8+Math.sin(gTick/50)*1.2,0,Math.PI*2);
let og=ctx.createRadialGradient(cx,oy,2,cx,oy,8);
og.addColorStop(0,"rgba(255,255,255,0.3)");og.addColorStop(0.5,"rgba(168,139,255,0.15)");og.addColorStop(1,"rgba(168,139,255,0)");
ctx.fillStyle=og;ctx.fill();
ctx.shadowBlur=0;
ctx.beginPath();ctx.arc(cx-1,oy-1,2.5,0,Math.PI*2);
ctx.fillStyle="rgba(255,255,255,0.4)";ctx.fill();

// === FLOATING PARTICLES ===
for(let i=0;i<5;i++){let px=cx-35+Math.sin(gTick/300+i*1.2)*40;
let py=160+Math.sin(gTick/200+i*2)*20+i*10;
ctx.fillStyle="rgba(200,180,255,"+(0.04+Math.sin(gTick/150+i)*0.03)+")";
ctx.beginPath();ctx.arc(px,py,1.2,0,Math.PI*2);ctx.fill();}

requestAnimationFrame(dr);
}
dr();

// Mouse tracking
document.addEventListener("mousemove",function(e){
let r=cv.getBoundingClientRect();
let mx=(e.clientX-r.left)*(W/r.width);
eyeTx+=(mx-cx)*0.03;eyeTx=Math.max(-18,Math.min(18,eyeTx));
});

// === RESPONSES ===
const RK={
"跑图|路线|怎么跑":["今天推荐跑云野+雨林，20分钟拿满蜡烛！","先禁阁再墓土效率最高，记得带矮人面具","路线：晨岛→云野→雨林→禁阁，顺便收大蜡烛"],
"大蜡烛|季节蜡烛":["今天大蜡烛在云野大厅1堆，雨林3堆，墓土1堆","季节蜡烛在禁阁和墓土各2堆，有任务记得做"],
"献祭|暴风眼":["暴风眼刷新了！第一阶段躲石头，第二阶段冲过去点亮石像","推荐看视频攻略再进，多带几个好友一起"],
"故事|趣事":["想起在雨林遇到一只小黑，我们互相点亮后一起跑了一整张地图，好温暖","你知道吗？天空王国的先祖们来自不同星球"],
"唱歌":["啦啦啦~ 光遇的BGM你会哼吗？我最喜欢云野的那段旋律","我在遇境弹琴给你听吧～虽然我现在只能哼哼","🎵 飞在云野上空，风轻轻吹过~ 这是我临时编的！"],
"可爱|好看|漂亮|美":["嘿嘿，被你夸了我好开心","谢谢！你也很温柔呢","那我以后多陪你聊天"],
"你好|嗨|hi|喂":["你好呀！今天跑图了吗？","嗨，我一直在等你找我聊天呢","你好！我刚在看星星呢"],
"名字|你叫|是谁":["我叫小灵，是你的光遇动漫伙伴✨","我是小灵，来自光遇世界的精灵，很高兴认识你~"],
"再见|拜拜|晚安|先下了":["晚安，明天一起跑图哦！","拜拜，我就在这里等你回来"],
"你会|能做什么":["我会陪你聊天、讲光遇攻略和冷知识、给你唱歌、哄你开心","我能做你的专属光遇小助手和聊天伙伴"],
"冷笑话|笑话":["为什么光崽不带雨伞？因为她们有雨妈护体呀","献祭的时候别问先祖路怎么走，他们自己都迷路了"],
"知识|冷知识":["每张地图都有至少3个隐藏空间，你发现了吗？","按坐下键你的光崽会冒泡泡，超可爱"],
"默认":["嗯~你继续说，我在听呢","真的吗？好有意思，多说一点！","我在认真听着呢 ✨"]
};

function mt(t){
t=t.toLowerCase();
for(let k in RK){let ws=k.split("|");for(let w of ws){if(t.includes(w)){let a=RK[k];return a[Math.floor(Math.random()*a.length)];}}}
let d=RK["默认"];return d[Math.floor(Math.random()*d.length)];
}

function sd(){
let e=document.getElementById("inp"),v=e.value.trim();if(!v)return;e.value="";go(v);
}
function q(v){document.getElementById("inp").value=v;go(v);document.getElementById("inp").value="";}

function go(t){
document.getElementById("lb").textContent="你说的";
document.getElementById("tx").textContent=t;
document.getElementById("st").textContent="💜 小灵正在思考...";
expr="think";
let r=mt(t);
mood=Math.min(100,mood+4);
setTimeout(function(){
document.getElementById("lb").textContent="小灵说";
document.getElementById("tx").textContent=r;
document.getElementById("st").textContent="💜 想继续聊天就叫我~";
talk=true;expr=r.includes("可爱")||r.includes("喜欢")?"happy":"idle";
setTimeout(function(){talk=false;expr="idle";},Math.max(1500,r.length*130));
try{let s=r.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{200D}\u{2934}\u{2935}\u{25AA}\u{25AB}\u{25FB}\u{25FC}\u{25FD}\u{25FE}\u{2B05}\u{2B06}\u{2B07}\u{2B1B}\u{2B1C}\u{2B50}\u{2B55}\u{3030}\u{303D}\u{3297}\u{3299}\u{23CF}\u{23E9}-\u{23F3}\u{23F8}-\u{23FA}\u{24C2}\u{25AA}\u{25AB}\u{25B6}\u{25C0}\u{25FB}-\u{25FE}\u{2600}-\u{27BF}\u{2934}\u{2935}\u{2B05}-\u{2B07}\u{2B1B}\u{2B1C}\u{2B50}\u{2B55}\u{3030}\u{303D}\u{3297}\u{3299}]/gu,"").replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s\.,!\?\u3001\u3002\uff0c\u300a\u300b\uff01\uff1f\u2014\u2014\u2026]/g,"").trim();if(s){let u=new SpeechSynthesisUtterance(s);u.lang="zh-CN";u.rate=1.0;u.pitch=1.0;let v=window.speechSynthesis.getVoices();let cv=v.find(v=>v.lang.startsWith("zh"));if(cv)u.voice=cv;if(window.speechSynthesis&&!/Android|iPhone|iPad/i.test(navigator.userAgent))window.speechSynthesis.speak(u);}}catch(e){}
},600);
}

let rec=null,rz=false;
function tm(){
try{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR){document.getElementById("st").textContent="浏览器不支持语音，请打字";return;}
if(!rec){rec=new SR();rec.lang="zh-CN";rec.interimResults=false;
rec.onresult=function(e){let t=e.results[0][0].transcript;document.getElementById("inp").value=t;sm();go(t);};
rec.onerror=function(){sm();};}
if(rz)sm();
else{rec.start();rz=true;document.getElementById("mb").classList.add("a");
document.getElementById("st").textContent="🎤 说吧，我在听...";}
}catch(e){document.getElementById("st").textContent="语音启动失败，请打字吧";}
}
function sm(){rz=false;document.getElementById("mb").classList.remove("a");
try{if(rec)rec.stop();}catch(e){}
document.getElementById("st").textContent="💜 点话筒说话或打字";}
</script>
</body>
</html>
