<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>小游戏合集</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0f0c29,#302b63,#24243e);min-height:100vh;font-family:"PingFang SC",sans-serif;padding:30px 16px;color:#fff}
h1{text-align:center;font-size:28px;margin-bottom:8px;background:linear-gradient(135deg,#ffd700,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:rgba(255,255,255,0.4);font-size:14px;margin-bottom:30px}
.grid{max-width:500px;margin:0 auto;display:grid;gap:16px}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:20px;padding:20px;transition:0.3s;text-decoration:none;color:#fff;display:block}
.card:hover{background:rgba(255,255,255,0.08);transform:translateY(-2px);border-color:rgba(168,139,255,0.2)}
.card .icon{font-size:36px;margin-bottom:8px}
.card .name{font-size:18px;font-weight:700;margin-bottom:4px}
.card .desc{color:rgba(255,255,255,0.5);font-size:13px}
.tag{display:inline-block;background:rgba(168,139,255,0.15);color:#a78bfa;font-size:11px;padding:2px 10px;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<h1>小游戏合集</h1>
<p class="sub">by YIXinZZ</p>
<div class="grid">
<a class="card" href="gravity.html">
<div class="icon">🪐</div>
<div class="name">重力翻转</div>
<div class="desc">点击翻转重力，精准落在平台上！原创挑战小游戏</div>
<span class="tag">🎮 游戏</span>
</a>
<a class="card" href="light_spirit.html">
<div class="icon">✨</div>
<div class="name">光遇小精灵</div>
<div class="desc">动漫风格 AI 伙伴，支持语音聊天、陪你谈心</div>
<span class="tag">💬 聊天</span>
</a>
<a class="card" href="watermelon.html">
<div class="icon">🍉</div>
<div class="name">合成大西瓜</div>
<div class="desc">相同水果碰撞合成，挑战合成大西瓜！</div>
<span class="tag">🎮 游戏</span>
</a>
<a class="card" href="index_xhs.html">
<div class="icon">📝</div>
<div class="name">小红书文案生成器</div>
<div class="desc">输入主题一键生成爆款笔记文案</div>
<span class="tag">🛠 工具</span>
</a>
</div>
<p style="text-align:center;color:rgba(255,255,255,0.15);font-size:12px;margin-top:30px">更多工具持续更新中...</p>
</body>
</html>
