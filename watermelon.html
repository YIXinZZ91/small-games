<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🍉 合成大西瓜</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(180deg,#0a0a1a 0%,#1a1040 30%,#0d1b3e 70%,#0a0a1a 100%);min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.game-wrap{position:relative;width:420px;max-width:100vw}
canvas{display:block;border-radius:16px}

/* Start Screen */
.start-screen{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(10,10,30,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;border-radius:16px;padding:30px}
.start-screen .logo{font-size:64px;animation:bounce 1.2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.start-screen h1{font-size:30px;color:#fff;margin:10px 0;background:linear-gradient(135deg,#ffd700,#ff6b6b,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.start-screen .subtitle{color:#aab;font-size:14px;margin-bottom:24px}
.start-screen .rules{background:rgba(255,255,255,.06);border-radius:14px;padding:18px;max-width:320px;margin-bottom:24px;text-align:left}
.start-screen .rules h3{color:#ffd700;font-size:15px;margin-bottom:10px;text-align:center}
.start-screen .rules li{color:#ccd;font-size:13px;margin:7px 0;padding-left:6px;line-height:1.6}
.start-screen .btn-start{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;border:none;border-radius:30px;padding:16px 50px;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 6px 30px rgba(238,90,36,.4);transition:.2s}
.start-screen .btn-start:active{transform:scale(.93)}
.start-screen .hint{color:#666;font-size:12px;margin-top:16px}

/* Top UI */
.top-bar{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.top-bar>*{pointer-events:auto}
.score-panel{background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-radius:14px;padding:8px 16px;display:flex;align-items:center;gap:8px}
.score-panel .icon{font-size:20px}
.score-panel .val{color:#fff;font-size:18px;font-weight:700;min-width:40px}
.score-panel .label{color:#889;font-size:11px}
.best-panel{background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-radius:14px;padding:8px 16px;display:flex;align-items:center;gap:6px}
.best-panel .val{color:#ffd700;font-size:18px;font-weight:700}
.best-panel .label{color:#889;font-size:11px}
.next-preview{position:absolute;right:14px;top:80px;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);border-radius:14px;padding:10px 14px;text-align:center;z-index:10}
.next-preview .nl{color:#889;font-size:11px;margin-bottom:4px}
.next-preview .nf{font-size:38px}

/* Level bar */
.level-bar{position:absolute;bottom:14px;left:14px;right:14px;display:flex;gap:3px;z-index:10;pointer-events:none}
.level-dot{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.1);transition:.3s}
.level-dot.achieved{background:#ffd700;box-shadow:0 0 6px rgba(255,215,0,.5)}

/* Game Over */
.game-over-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.78);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;border-radius:16px}
.game-over-overlay h2{color:#fff;font-size:28px;margin-bottom:6px}
.game-over-overlay .final-score{color:#ffd700;font-size:52px;font-weight:900;margin-bottom:8px}
.game-over-overlay .sub{color:#aab;font-size:13px;margin-bottom:20px}
.btn{border:none;border-radius:28px;padding:14px 36px;font-size:16px;font-weight:700;cursor:pointer;margin:5px;transition:.2s;font-family:inherit}
.btn-revive{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#fff;animation:glow 1.5s infinite}
.btn-restart{background:rgba(255,255,255,.15);color:#fff}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,107,107,.5)}50%{box-shadow:0 0 0 18px rgba(255,107,107,0)}}

/* Ad Sim */
.ad-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:#111;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:30;border-radius:16px}
.ad-overlay .ad-timer{font-size:60px;font-weight:900;color:#ffd700;margin:16px 0}
.ad-overlay .ad-emoji{font-size:48px;animation:bounce .8s ease infinite}

/* Particles */
.particle{position:absolute;pointer-events:none;z-index:15;animation:pop .6s ease-out forwards;font-size:22px;font-weight:700}
@keyframes pop{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(1.8)}}

/* Ripple */
.ripple{position:absolute;border:2px solid rgba(255,255,255,.4);border-radius:50%;pointer-events:none;z-index:14;animation:rippleOut .5s ease-out forwards}
@keyframes rippleOut{0%{width:0;height:0;opacity:1}100%{width:120px;height:120px;opacity:0;margin-left:-60px;margin-top:-60px}}

/* Toast */
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#ffd700;padding:12px 28px;border-radius:30px;font-size:18px;font-weight:700;z-index:25;pointer-events:none;animation:toastIn .3s ease,toastOut .3s ease 1.5s forwards}
@keyframes toastIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-50%) scale(.5)}}
</style>
</head>
<body>
<div class="game-wrap" id="gameWrap">
  <canvas id="c"></canvas>

  <!-- Start -->
  <div class="start-screen" id="startScreen">
    <div class="logo">🍉</div>
    <h1>合成大西瓜</h1>
    <p class="subtitle">相同水果碰撞 → 合成更大的水果！</p>
    <div class="rules">
      <h3>📖 玩法规则</h3>
      <ul>
        <li>🍒 点击/点击屏幕放置水果</li>
        <li>🔄 两个相同水果碰在一起会自动合成</li>
        <li>📈 合成越大水果得分越高</li>
        <li>⚠️ 水果堆到顶部红线 → 游戏结束</li>
        <li>❤️ 看广告可以复活继续玩</li>
        <li>🏆 目标：合成大西瓜 🍉！</li>
      </ul>
    </div>
    <button class="btn-start" onclick="startGame()">🎮 开始游戏</button>
    <p class="hint">也可以用键盘 ← → 移动，空格投放</p>
  </div>

  <!-- Top UI -->
  <div class="top-bar" id="topBar" style="display:none">
    <div class="score-panel">
      <span class="icon">🏆</span>
      <div><div class="label">得分</div><div class="val" id="scoreDisp">0</div></div>
    </div>
    <div class="best-panel">
      <span>👑</span>
      <div><div class="label">最佳</div><div class="val" id="bestDisp">0</div></div>
    </div>
  </div>

  <div class="next-preview" id="nextPrev" style="display:none">
    <div class="nl">下一个</div>
    <div class="nf" id="nextEmoji">🍒</div>
  </div>

  <div class="level-bar" id="levelBar" style="display:none"></div>

  <!-- Game Over -->
  <div class="game-over-overlay" id="goScreen">
    <h2>💥 游戏结束</h2>
    <div class="final-score" id="goScore">0</div>
    <p class="sub" id="goSub"></p>
    <button class="btn btn-revive" onclick="doRevive()">📺 看广告复活</button>
    <button class="btn btn-restart" onclick="fullRestart()">🔄 重新开始</button>
  </div>

  <!-- Ad -->
  <div class="ad-overlay" id="adScreen">
    <div class="ad-emoji">📺</div>
    <p style="color:#fff;font-size:18px">正在播放广告</p>
    <div class="ad-timer" id="adTimer">5</div>
    <p style="color:#666;font-size:12px">感谢支持 · 广告后复活</p>
  </div>
</div>

<script>
const FRUITS = [
  {n:'樱桃',e:'🍒',r:16,s:1,c:'#e74c3c'},
  {n:'草莓',e:'🍓',r:24,s:3,c:'#ff6b6b'},
  {n:'葡萄',e:'🍇',r:32,s:6,c:'#9b59b6'},
  {n:'橘子',e:'🍊',r:40,s:10,c:'#f39c12'},
  {n:'苹果',e:'🍎',r:48,s:20,c:'#e74c3c'},
  {n:'梨子',e:'🍐',r:56,s:35,c:'#a0d468'},
  {n:'桃子',e:'🍑',r:64,s:55,c:'#f5a0b5'},
  {n:'菠萝',e:'🍍',r:73,s:80,c:'#f6d365'},
  {n:'蜜瓜',e:'🍈',r:82,s:120,c:'#7bc67e'},
  {n:'西瓜',e:'🍉',r:92,s:200,c:'#2ecc71'},
];
const M=FRUITS.length-1;

let W,H,CX,CY,CW,CH,DY,fruits=[],cur=null,nextLv=0,score=0,best=0,run=false,canDrop=true,mx=200,adCnt=0,started=false;

const c=document.getElementById('c'),ctx=c.getContext('2d'),wrap=document.getElementById('gameWrap');

function rs(){
  W=Math.min(420,window.innerWidth-16);
  H=Math.min(740,window.innerHeight-16);
  c.width=W;c.height=H;
  CX=16;CY=90;CW=W-32;CH=H-140;DY=CY+55;
}
rs();window.addEventListener('resize',rs);
best=parseInt(localStorage.getItem('s_best')||0);
document.getElementById('bestDisp').textContent=best;

// Level bar
(function(){
  const bar=document.getElementById('levelBar');
  for(let i=0;i<FRUITS.length;i++){
    const d=document.createElement('div');
    d.className='level-dot';d.title=FRUITS[i].n;d.id='ld'+i;
    bar.appendChild(d);
  }
  bar.style.display='flex';
})();

function rndF(max=4){return Math.floor(Math.random()*Math.min(max+1,FRUITS.length))}
function spawn(lv){return{lv,x:mx,y:CY,vx:0,vy:0,r:FRUITS[lv].r,a:true,mg:false,st:0,stuck:0}}
function drop(){
  if(!canDrop||!run)return;
  cur=spawn(nextLv);fruits.push(cur);
  nextLv=rndF(adCnt>0?3:4);
  document.getElementById('nextEmoji').textContent=FRUITS[nextLv].e;
  canDrop=false;setTimeout(()=>canDrop=true,450);
}

function chkMerge(a,b){
  if(a.mg||b.mg||a.lv!==b.lv||a.lv>=M)return false;
  const d=Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2);
  return d<(a.r+b.r)*0.72;
}
function doMerge(a,b){
  a.mg=b.mg=true;
  const nl=a.lv+1;
  const nx=(a.x+b.x)/2,ny=(a.y+b.y)/2;
  fruits.push({lv:nl,x:nx,y:ny,vx:(a.vx+b.vx)*.25,vy:(a.vy+b.vy)*.25-3,r:FRUITS[nl].r,a:true,mg:false,st:0,stuck:0});
  score+=FRUITS[nl].s;
  document.getElementById('scoreDisp').textContent=score;
  // particles
  for(let i=0;i<8;i++){
    const p=document.createElement('div');p.className='particle';
    p.textContent='✨';p.style.left=(nx/W*100)+'%';p.style.top=(ny/H*100)+'%';
    p.style.transform=`translate(${(Math.random()-.5)*80}px,${(Math.random()-.5)*80}px)`;
    wrap.appendChild(p);setTimeout(()=>p.remove(),600);
  }
  // ripple
  const rp=document.createElement('div');rp.className='ripple';
  rp.style.left=(nx/W*100)+'%';rp.style.top=(ny/H*100)+'%';
  wrap.appendChild(rp);setTimeout(()=>rp.remove(),500);
  // level bar
  document.getElementById('ld'+nl).classList.add('achieved');
  // toast on big merges
  if(nl>=7){showToast(FRUITS[nl].e+' '+FRUITS[nl].n+'！')}
  if(nl===M){setTimeout(()=>showToast('🎉 大西瓜！！'),300)}
}
function showToast(msg){
  const t=document.createElement('div');t.className='toast';
  t.textContent=msg;wrap.appendChild(t);setTimeout(()=>t.remove(),2000);
}

function update(){
  if(!run)return;
  for(const f of fruits){
    if(!f.a)continue;
    f.vy+=0.5;f.x+=f.vx;f.y+=f.vy;f.vx*=.99;
    if(f.x-f.r<CX){f.x=CX+f.r;f.vx=Math.abs(f.vx)*.55}
    if(f.x+f.r>CX+CW){f.x=CX+CW-f.r;f.vx=-Math.abs(f.vx)*.55}
    if(f.y+f.r>CY+CH){f.y=CY+CH-f.r;f.vy=-Math.abs(f.vy)*.55;if(Math.abs(f.vy)<1)f.vy=0}
  }
  for(let i=0;i<fruits.length;i++)
    for(let j=i+1;j<fruits.length;j++)
      if(chkMerge(fruits[i],fruits[j]))doMerge(fruits[i],fruits[j]);
  fruits=fruits.filter(f=>!f.mg);
  // game over check
  for(const f of fruits){
    if(!f.a)continue;
    if(f.y-f.r<DY&&Math.abs(f.vy)<.5){f.st++;if(f.st>90){endGame();return}}
    else f.st=0;
  }
  if(cur&&cur.a&&cur.y-cur.r<DY-25&&Math.abs(cur.vy)<.3){cur.stuck++;if(cur.stuck>120){endGame();return}}
}

function endGame(){
  if(!run)return;run=false;
  if(score>best){best=score;localStorage.setItem('s_best',best);document.getElementById('bestDisp').textContent=best}
  document.getElementById('goScore').textContent=score+'分';
  document.getElementById('goSub').textContent=score>=200?'🔥 太强了！':'再试一次，你可以的！';
  document.getElementById('goScreen').style.display='flex';
}

function doRevive(){
  document.getElementById('goScreen').style.display='none';
  const ad=document.getElementById('adScreen');ad.style.display='flex';
  let t=5;document.getElementById('adTimer').textContent=t;
  const iv=setInterval(()=>{t--;document.getElementById('adTimer').textContent=t;
    if(t<=0){clearInterval(iv);ad.style.display='none';reviveExec()}},1000);
}

function reviveExec(){
  adCnt++;
  const mid=CY+CH*.45;
  fruits=fruits.filter(f=>f.y>mid||f.lv>=M-2);
  for(const f of fruits){f.y=Math.min(f.y+35,CY+CH-f.r);f.vy=0;f.st=0;f.stuck=0}
  cur=null;run=true;canDrop=true;
  nextLv=rndF(3);document.getElementById('nextEmoji').textContent=FRUITS[nextLv].e;
}

function fullRestart(){
  fruits=[];cur=null;score=0;run=true;canDrop=true;adCnt=0;nextLv=rndF(4);
  document.getElementById('scoreDisp').textContent='0';
  document.getElementById('nextEmoji').textContent=FRUITS[nextLv].e;
  document.getElementById('goScreen').style.display='none';
  document.getElementById('adScreen').style.display='none';
  // reset level bar
  for(let i=0;i<FRUITS.length;i++)document.getElementById('ld'+i).classList.remove('achieved');
}

function startGame(){
  started=true;run=true;
  document.getElementById('startScreen').style.display='none';
  document.getElementById('topBar').style.display='flex';
  document.getElementById('nextPrev').style.display='block';
  nextLv=rndF(4);
  document.getElementById('nextEmoji').textContent=FRUITS[nextLv].e;
  document.getElementById('scoreDisp').textContent='0';
  // init level bar
  for(let i=0;i<FRUITS.length;i++)document.getElementById('ld'+i).classList.remove('achieved');
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // bg grid
  ctx.strokeStyle='rgba(255,255,255,.03)';
  for(let x=CX;x<=CX+CW;x+=30){ctx.beginPath();ctx.moveTo(x,CY);ctx.lineTo(x,CY+CH);ctx.stroke()}
  for(let y=CY;y<=CY+CH;y+=30){ctx.beginPath();ctx.moveTo(CX,y);ctx.lineTo(CX+CW,y);ctx.stroke()}
  // container
  ctx.fillStyle='rgba(255,255,255,.03)';
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=2;
  rr(CX,CY,CW,CH,10);ctx.fill();ctx.stroke();
  // death line
  ctx.strokeStyle='rgba(255,90,90,.5)';ctx.lineWidth=2;ctx.setLineDash([8,5]);
  ctx.beginPath();ctx.moveTo(CX,DY);ctx.lineTo(CX+CW,DY);ctx.stroke();ctx.setLineDash([]);
  // "危险线" label
  ctx.fillStyle='rgba(255,90,90,.6)';ctx.font='10px "PingFang SC"';
  ctx.fillText('⚠ 危险线',CX+4,DY-6);
  // fruits
  for(const f of fruits)drawF(f);
  // preview
  if(canDrop&&run){
    let px=mx;const r=FRUITS[nextLv].r;
    if(px-r<CX)px=CX+r;if(px+r>CX+CW)px=CX+CW-r;
    ctx.globalAlpha=.35;
    ctx.font=`${r*1.8}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(FRUITS[nextLv].e,px,CY+r);
    // dotted line down
    ctx.strokeStyle='rgba(255,255,255,.1)';ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.moveTo(px,CY+r+4);ctx.lineTo(px,CY+CH-2);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=1;
  }
}
function drawF(f){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=8;ctx.shadowOffsetY=4;
  ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
  const grad=ctx.createRadialGradient(f.x-f.r*.2,f.y-f.r*.3,f.r*.05,f.x,f.y,f.r);
  grad.addColorStop(0,FRUITS[f.lv].c);grad.addColorStop(1,'rgba(0,0,0,.25)');
  ctx.fillStyle=grad;ctx.fill();
  ctx.shadowColor='transparent';
  ctx.font=`${f.r*1.7}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(FRUITS[f.lv].e,f.x,f.y);
  // shine
  ctx.beginPath();ctx.arc(f.x-f.r*.28,f.y-f.r*.28,f.r*.25,0,Math.PI*2);
  ctx.fillStyle='rgba(255,255,255,.25)';ctx.fill();
  ctx.restore();
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);
  ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);
  ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function loop(){update();draw();requestAnimationFrame(loop)}

// Input
c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width)});
c.addEventListener('touchmove',e=>{e.preventDefault();const r=c.getBoundingClientRect();mx=(e.touches[0].clientX-r.left)*(W/r.width)},{passive:false});
c.addEventListener('click',()=>{if(started)drop()});
c.addEventListener('touchend',e=>{e.preventDefault();if(started)drop()});
document.addEventListener('keydown',e=>{
  if(!started)return;
  if(e.key==='ArrowLeft')mx=Math.max(CX+30,mx-25);
  if(e.key==='ArrowRight')mx=Math.min(CX+CW-30,mx+25);
  if(e.key===' '||e.key==='Enter'){e.preventDefault();drop()}
});

loop();
</script>
</body>
</html>
